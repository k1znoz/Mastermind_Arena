version: "3.9"

services:
  mastermind-back:
    image: mastermind-arena-back:latest
    container_name: mastermind-back
    command: >
      mvn -e -pl deduction-engine compile exec:java
      -Dexec.mainClass=io.mastermindarena.deduction.api.submitaction.LocalSubmitActionHttpServerMain
    ports:
      - "8081:8080"
    environment:
      APP_HTTP_HOST: "0.0.0.0"
      APP_HTTP_PORT: "8080"
      APP_API_KEY_HEADER: "X-API-Key"
      APP_API_KEY: "${APP_API_KEY}"
      APP_DB_URL: "${APP_DB_URL}"
      APP_DB_USER: "${APP_DB_USER}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD}"
      APP_DB_SCHEMA: "${APP_DB_SCHEMA:-public}"
      APP_REQUEST_ID_HEADER: "X-Request-Id"
      APP_LOG_LEVEL: "INFO"