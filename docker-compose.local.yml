services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${APP_DB_USER:?Use .env.local}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Use .env.local}
      POSTGRES_DB: mastermind_local
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
