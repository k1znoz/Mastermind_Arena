name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena_test
          POSTGRES_PASSWORD: ci_validation_only
          POSTGRES_DB: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARENA_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/arena_test
      ARENA_TEST_DB_USER: arena_test
      ARENA_TEST_DB_PASSWORD: ci_validation_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -pl deduction-engine -Pquality clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: deduction-engine/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App_Front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: App_Front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check
      - run: npm run build
